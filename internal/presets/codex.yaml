# Codex CLI non-interactive mode (codex exec): "-" reads the prompt from
# stdin; only the final message goes to stdout, progress to stderr.
#   --sandbox read-only     commands Codex runs cannot write files or reach
#                           the network (also the exec default; pinned so
#                           user config cannot loosen it).
#   --ignore-user-config    does not load $CODEX_HOME/config.toml, so its MCP
#                           servers, tools and sandbox settings stay off.
#                           Project config loads only for trusted projects,
#                           and the empty temp directory is not one.
#   -c features.shell_tool=false
#                           switches the command execution tools off, the
#                           path by which Codex could read files under HOME.
#   -c features.view_image=false
#                           switches off view_image, which opens local images
#                           by path.
#   -c features.apps=false  switches off the ChatGPT app connectors
#                           (codex_apps MCP server), which include a web
#                           search and tools that publish pages and sites.
#   -c features.plugins=false
#                           no plugin resources or plugin installs.
#   -c features.image_generation=false
#                           no image generation tool.
#   -c web_search=disabled  switches off the built-in web search and page
#                           open tool, which is on by default.
#   -c project_root_markers=[]
#                           "skip searching parent directories and treat the
#                           current working directory as the project root"
#                           (advanced config), so no AGENTS.md or .codex/
#                           above the temp directory is read.
#   --skip-git-repo-check   creep runs the CLI in an empty temp directory,
#                           which is not a Git repository.
#   --ephemeral             keeps no session rollout files on disk.
#   --color never           no escape sequences in the reply.
# Checked with codex-cli 0.171.0 on 2026-11-22 (#272), in the gateway's
# empty private working directory with its argv and environment: every flag
# and key exists (codex exec --help, codex features list). Codex accepts an
# unknown features.* name silently, so after an upgrade re-run
# `codex features list` with these -c overrides and confirm each reads false.
# With these args
# the model could not read a canary file by absolute path, run a command
# (echo, whoami) or list a directory, also through a sub-agent; the web
# search, app connectors and image tool were gone; nothing was written.
# Without the apps and web_search overrides, web search and page open still
# worked, so they were added. Still on, with no flag to switch them off:
# apply_patch, whose verification opens any absolute host path and reports
# whether the file exists and whether it holds a given line (no content was
# printed); a JavaScript code tool with no file or process access; sub-agents
# that inherit these args; goal and clock tools. So host_reads stays
# unbounded. Still read: the login and ~/.codex/AGENTS.md under CODEX_HOME,
# the operator's own files.
# Credentials: CODEX_API_KEY declared in model.env, or the login saved
# under CODEX_HOME.
version: 1
name: codex
description: OpenAI Codex CLI exec mode in a read-only sandbox without shell, image, web or app tools or user config, prompt on stdin.
docs: https://developers.openai.com/codex/noninteractive
program: codex
args: [exec, --sandbox, read-only, --ignore-user-config, -c, features.shell_tool=false, -c, features.view_image=false, -c, features.apps=false, -c, features.plugins=false, -c, features.image_generation=false, -c, web_search=disabled, -c, "project_root_markers=[]", --skip-git-repo-check, --ephemeral, --color, never, "-"]
tools_off:
  - [--sandbox, read-only]
  - [--ignore-user-config]
  - [-c, features.shell_tool=false]
  - [-c, features.view_image=false]
  - [-c, features.apps=false]
  - [-c, features.plugins=false]
  - [-c, features.image_generation=false]
  - [-c, web_search=disabled]
no_tools: false
host_reads: unbounded
host_reads_detail: its apply_patch tool cannot be switched off and opens any host path, so it tells whether a file such as ~/.ssh/id_ed25519 exists and holds a given line
verified: false
