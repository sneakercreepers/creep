# Release build for creep (#19). Run only by .github/workflows/release.yml:
# the release job signs and publishes from the `release` environment; pull
# requests and manual runs build a snapshot with nothing signed or published.
version: 2

project_name: creep

builds:
  - id: creep
    main: ./cmd/creep
    binary: creep
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible: no local paths, no build ID, file times from the commit.
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X github.com/sneakercreepers/creep/internal/buildinfo.version={{ .Tag }}
      - -X github.com/sneakercreepers/creep/internal/buildinfo.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: creep
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
    builds_info:
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless: the release job's OIDC identity signs checksums.txt, which covers
# every archive. The bundle holds the signature, certificate and Rekor entry.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# Notes come from GitHub, grouped by the labels in .github/release.yml.
changelog:
  use: github-native

release:
  github:
    owner: sneakercreepers
    name: creep
  # The workflow publishes the draft only after it has verified the signature
  # and provenance, so a broken release never becomes public (releases are immutable).
  draft: true
  replace_existing_draft: true
  prerelease: auto
  footer: |
    ## Verify this release

    Needs [cosign](https://docs.sigstore.dev/cosign/system_config/installation/) v3+ and the [GitHub CLI](https://cli.github.com/). Download your archive, `checksums.txt` and `checksums.txt.sigstore.json`, then:

    ```sh
    cosign verify-blob \
      --certificate-identity 'https://github.com/sneakercreepers/creep/.github/workflows/release.yml@refs/tags/{{ .Tag }}' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --bundle checksums.txt.sigstore.json checksums.txt
    sha256sum --check --ignore-missing checksums.txt   # macOS: shasum -a 256 --check --ignore-missing checksums.txt
    gh attestation verify creep_{{ .Version }}_linux_amd64.tar.gz \
      --repo sneakercreepers/creep \
      --signer-workflow sneakercreepers/creep/.github/workflows/release.yml
    ```

    Each archive has an SPDX SBOM (`<archive>.sbom.json`).

    ## Supported versions

    Before v1.0 only the latest minor release gets fixes. See [SECURITY.md](https://github.com/sneakercreepers/creep/blob/main/SECURITY.md#supported-versions).
