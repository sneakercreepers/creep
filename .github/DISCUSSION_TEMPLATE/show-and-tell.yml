title: "[Model results] "
labels: ["model-results"]
body:
  - type: markdown
    attributes:
      value: Share how `creep` performs with your model. These results help everyone pick a model and help us tune strategies per tier. What to run and what is safe to post (never code, reports or `egress.log` of a private repository, keys or endpoint URLs) is in the guide [Sharing model results](https://github.com/sneakercreepers/creep/wiki/Sharing-model-results).
  - type: input
    id: model
    attributes:
      label: Model, version and provider
      placeholder: qwen3:8b · Ollama 0.9 · Q4_K_M
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware (local models)
      placeholder: RTX 4070 12GB · M3 Pro 36GB
  - type: input
    id: version
    attributes:
      label: creep version
    validations:
      required: true
  - type: textarea
    id: calibration
    attributes:
      label: Results
      description: The output of `creep bench --format json` with your model, or the `calibration:` line a scan prints and the Coverage by class table from `.creep/report.md` (per class, with 95% intervals).
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Observations
      description: Speed, cost, surprising strengths or weaknesses.
