name: PR

# The docs-only check (#57) fails a PR whose body ticks the
# Documentation-only box but changes more than documentation, and one that
# changes the agent-loop policy without an ADR (#56). It reads the
# body from the event payload on disk and the changed files from git: no API
# call. It runs again when the body is edited, so ticking the box later is
# checked too. Never pull_request_target: PR code must not run with a write
# token or secrets.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Depth 2 holds the merge commit and both parents: HEAD^1 is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # --no-renames lists a renamed file under both paths, so moving code
      # into docs/ still shows the code path it left.
      - name: Changed files
        run: git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"
      # The ADR-on-policy rule (#56) compares AGENTS.md outside its Current state with
      # the base.
      - name: Base AGENTS.md
        run: git show HEAD^1:AGENTS.md > "$RUNNER_TEMP/base-agents.md"
      - name: Docs-only scope and ADR on policy changes
        run: go run ./internal/tools/prcheck -event "$GITHUB_EVENT_PATH" -files "$RUNNER_TEMP/changed" -base-agents "$RUNNER_TEMP/base-agents.md"
