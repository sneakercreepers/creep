name: CI

# Never pull_request_target: PR code must not run with a write token or secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Docs-only pull requests (ADR 0018 amendment, 2026-11-23): the changes job
# says whether a pull request changes only prose no check reads; the heavy
# jobs then skip, which GitHub reports as success for a required check. The
# test matrix skips its steps instead, because a skipped matrix job reports
# no check under its expanded name. A push to main, and a failed changes job,
# run everything. secrets, dependency-review and docs-only always run.
jobs:
  changes:
    # From protected main, not the pull request's head, so a pull request
    # cannot rewrite the classifier to skip its own checks (ADR 0018
    # amendment, L3). A branch, not a SHA: the classifier tracks the base.
    uses: sneakercreepers/creep/.github/workflows/changes.yml@main # zizmor: ignore[unpinned-uses] main is protected and signed; a SHA pin would drift from the base
    permissions:
      contents: read

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Docs-only pull request, tests skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "only prose no check reads changed (ADR 0018 amendment); a push to main runs everything"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
          cache: false
      # Windows matches local dev (no cgo, so no -race); Linux runs -race.
      - name: Disable cgo on Windows
        if: needs.changes.outputs.docs_only != 'true' && runner.os == 'Windows'
        run: echo "CGO_ENABLED=0" >> "$GITHUB_ENV"
      # The runner has Docker: the sandbox integration tests fail rather
      # than skip there, so the hardened profile is proven on a real engine.
      - name: Require the sandbox runtime on Linux
        if: needs.changes.outputs.docs_only != 'true' && runner.os == 'Linux'
        run: echo "CREEP_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      - name: make check
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          make_bin="make"
          command -v make >/dev/null || make_bin=mingw32-make
          "$make_bin" check
          "$make_bin" build
      # make check is quiet on success, so this names the runtimes (and
      # their isolation) the sandbox tests ran on, and any one they skipped.
      - name: Sandbox runtimes tested
        if: needs.changes.outputs.docs_only != 'true' && runner.os == 'Linux'
        run: go test -count=1 -v -run '^TestRealCleanRemovesNetworks$' ./internal/sandbox | grep -E 'isolation|not usable|--- (PASS|SKIP|FAIL)'

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          skip-cache: true

  vuln:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, checked against both the
      # release checksums file and the GitHub release asset digest.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  workflows:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
          # The Action's documented example is a workflow users copy (ADR 0023).
          "$(go env GOPATH)/bin/actionlint" -color docs/examples/creep-action.yml
      # Online audits use the job's read-only token to resolve refs, so an
      # impostor commit (a SHA from a fork) or a stale pin comment fails. The
      # action pins every zizmor wheel by hash (pip --require-hashes).
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          online-audits: true
          min-severity: low
          advanced-security: false
          token: ${{ github.token }}

  budget:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make budget

  # Fixed protections (#17): a required status check of its own, so a broken
  # protection is named in the PR checks. make protections runs each
  # protection test with its broken fixture, the holistic --replay run and a
  # bounded fuzz of the gateway's redaction path.
  protections:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make protections
      # A failed fuzz run leaves its input under testdata/fuzz (#137).
      - name: upload fuzz crasher
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crasher
          path: internal/*/testdata/fuzz/
          retention-days: 7

  # The Action (action.yml, ADR 0023) end to end on sample repositories. No
  # release holds the code under review, so creep-path runs the internal/cli
  # test binary as creep: the real CLI, config layers and reports with the
  # protection tests' fake model, no key and no network
  # (CREEP_ACTION_STANDIN, internal/cli/actionstandin_test.go). The
  # vulnerable sample must fail on the gate (1), the clean one pass (0), and
  # the one whose creep.yaml lowers budget.max_calls to 1 must fail as
  # incomplete (4). The last step runs the Action's install script on the
  # published v0.1.0 release, so checksum and provenance verification is
  # proven against a real release, not only against fakes.
  action:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
      attestations: read # gh attestation verify reads this repository's release provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Stand-in binary, policy and samples
        run: |
          dir="$RUNNER_TEMP/selftest"
          mkdir -p "$dir"
          go test -c -o "$dir/creep" ./internal/cli
          printf 'defaults:\n  model:\n    contract: openai\n    endpoint: https://models.example.invalid/v1\n    name: test-model\n' >"$dir/policy.yaml"
          for sample in vulnerable clean starved; do
            mkdir -p "$dir/$sample"
            cp internal/cli/testdata/action/app.py "$dir/$sample/"
          done
          printf 'budget:\n  max_calls: 1\n' >"$dir/starved/creep.yaml"
      - name: Vulnerable sample
        id: vulnerable
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] actionlint v1.7.12 refuses $/, and ./ is the checked-out code under review
        env:
          CREEP_ACTION_STANDIN: vulnerable
          CREEP_POLICY: ${{ runner.temp }}/selftest/policy.yaml
        with:
          creep-path: ${{ runner.temp }}/selftest/creep
          working-directory: ${{ runner.temp }}/selftest/vulnerable
          incremental: "false"
          upload-sarif: "false"
          comment: "false"
      - name: Clean sample
        id: clean
        uses: ./ # zizmor: ignore[self-repository] actionlint v1.7.12 refuses $/, and ./ is the checked-out code under review
        env:
          CREEP_ACTION_STANDIN: not_vulnerable
          CREEP_POLICY: ${{ runner.temp }}/selftest/policy.yaml
        with:
          creep-path: ${{ runner.temp }}/selftest/creep
          working-directory: ${{ runner.temp }}/selftest/clean
          incremental: "false"
          upload-sarif: "false"
          comment: "false"
      - name: Sample whose creep.yaml lowers its budget
        id: starved
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] actionlint v1.7.12 refuses $/, and ./ is the checked-out code under review
        env:
          CREEP_ACTION_STANDIN: vulnerable
          CREEP_POLICY: ${{ runner.temp }}/selftest/policy.yaml
        with:
          creep-path: ${{ runner.temp }}/selftest/creep
          working-directory: ${{ runner.temp }}/selftest/starved
          incremental: "false"
          upload-sarif: "false"
          comment: "false"
      - name: Each sample ended as it must
        env:
          VULNERABLE: ${{ steps.vulnerable.outcome }} ${{ steps.vulnerable.outputs.exit-code }}
          CLEAN: ${{ steps.clean.outcome }} ${{ steps.clean.outputs.exit-code }}
          STARVED: ${{ steps.starved.outcome }} ${{ steps.starved.outputs.exit-code }}
          CLEAN_SARIF: ${{ steps.clean.outputs.sarif }}
          CLEAN_MARKDOWN: ${{ steps.clean.outputs.markdown }}
        run: |
          status=0
          for check in "vulnerable|$VULNERABLE|failure 1" "clean|$CLEAN|success 0" "starved|$STARVED|failure 4"; do
            IFS='|' read -r name got want <<<"$check"
            if [ "$got" != "$want" ]; then
              echo "::error::$name sample: outcome and exit code '$got', want '$want'"
              status=1
            fi
          done
          if [ ! -f "$CLEAN_SARIF" ] || [ ! -f "$CLEAN_MARKDOWN" ]; then
            echo "::error::the clean run published no SARIF or Markdown report"
            status=1
          fi
          exit "$status"
      - name: The install script verifies the published v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: v0.1.0
        run: |
          out="$RUNNER_TEMP/install-output"
          : >"$out"
          GITHUB_OUTPUT="$out" bash action/install.sh
          path="$(sed -n 's/^path=//p' "$out")"
          "$path" version | grep -Fx 'creep v0.1.0'
