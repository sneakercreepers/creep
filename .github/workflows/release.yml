name: Release

# A v* tag builds, signs and publishes a release from the `release`
# environment (maintainer approval, v* tags only). Pull requests that touch the
# release files and manual runs only build a snapshot: no secrets, no
# signature, nothing published.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - .github/scripts/release-tools.sh
      - .github/scripts/tag-ancestry.sh
      - .github/scripts/package-repos.sh
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install goreleaser and syft (sha256-pinned)
        run: bash .github/scripts/release-tools.sh
      - name: goreleaser check
        run: goreleaser check
      - name: Ancestry guard accepts main and refuses a stray or release/* commit
        run: |
          bash .github/scripts/tag-ancestry.sh "$(git rev-parse refs/remotes/origin/main)"
          stray="$(git -c user.name=ci -c user.email=ci@invalid commit-tree -m stray 'HEAD^{tree}')"
          if bash .github/scripts/tag-ancestry.sh "$stray"; then
            echo "::error::the ancestry guard accepted a commit that is not on main"
            exit 1
          fi
          git update-ref refs/remotes/origin/release/stray "$stray"
          if bash .github/scripts/tag-ancestry.sh "$stray"; then
            echo "::error::the ancestry guard accepted a commit on an unprotected release/* branch"
            exit 1
          fi
      - name: Snapshot build (no signature, nothing published)
        run: goreleaser release --snapshot --clean --skip=sign,publish
      - name: Binaries are reproducible
        run: |
          sha256sum dist/creep_*/creep* > "$RUNNER_TEMP/first.sha256"
          goreleaser release --snapshot --clean --skip=sign,publish,sbom
          sha256sum dist/creep_*/creep* | diff "$RUNNER_TEMP/first.sha256" -
      # The cask and the manifest must pin the sha256 of archives that
      # checksums.txt lists; the push script must publish nothing without the
      # token or for a prerelease, and otherwise update both files on main.
      - name: Cask and Scoop manifest pin the release archives
        run: |
          check_pins() { # file count
            sums="$(grep -oE '[0-9a-f]{64}' "$1" | sort -u)"
            test "$(wc -l <<<"$sums")" -eq "$2" || { echo "::error::$1 does not pin $2 archives"; exit 1; }
            while read -r sum; do
              grep -q "^$sum " dist/checksums.txt || { echo "::error::$1 pins $sum, which checksums.txt does not list"; exit 1; }
            done <<<"$sums"
          }
          check_pins dist/homebrew/Casks/creep.rb 4 # darwin and linux, amd64 and arm64
          check_pins dist/scoop/creep.json 2 # windows amd64 and arm64
      - name: Tap and bucket push is skipped without a token and for a prerelease
        run: |
          set -o pipefail
          fake="$RUNNER_TEMP/fakebin"
          mkdir -p "$fake"
          cat > "$fake/gh" <<'EOF'
          #!/usr/bin/env bash
          echo "$*" >> "$RUNNER_TEMP/gh-calls"
          case "$*" in
            *"-X PUT"*) echo https://github.invalid/commit ;;
            *Casks*) echo oldsha ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "$fake/gh"
          export PATH="$fake:$PATH"
          PACKAGE_REPOS_TOKEN='' bash .github/scripts/package-repos.sh v9.9.9 dist | grep 'were not updated'
          PACKAGE_REPOS_TOKEN=fake bash .github/scripts/package-repos.sh v9.9.9-rc1 dist | grep 'is a prerelease'
          if [ -e "$RUNNER_TEMP/gh-calls" ]; then
            echo "::error::package-repos.sh called gh without a token or for a prerelease"
            exit 1
          fi
          PACKAGE_REPOS_TOKEN=fake bash .github/scripts/package-repos.sh v9.9.9 dist
          grep -q '^api -X PUT repos/sneakercreepers/homebrew-tap/contents/Casks/creep.rb .*-f sha=oldsha' "$RUNNER_TEMP/gh-calls"
          grep '^api -X PUT repos/sneakercreepers/scoop-bucket/contents/bucket/creep.json ' "$RUNNER_TEMP/gh-calls" | grep -vq 'sha='
          # A pin that checksums.txt does not list stops the script before any call.
          bad="$RUNNER_TEMP/bad-dist"
          mkdir -p "$bad/homebrew/Casks" "$bad/scoop"
          cp dist/homebrew/Casks/creep.rb "$bad/homebrew/Casks/"
          cp dist/scoop/creep.json "$bad/scoop/"
          grep -v 'darwin_amd64.tar.gz$' dist/checksums.txt > "$bad/checksums.txt"
          rm "$RUNNER_TEMP/gh-calls"
          if PACKAGE_REPOS_TOKEN=fake bash .github/scripts/package-repos.sh v9.9.9 "$bad"; then
            echo "::error::package-repos.sh published with a pin checksums.txt does not list"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/gh-calls" ]; then
            echo "::error::package-repos.sh called gh before checking the pins"
            exit 1
          fi

  ancestry:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: bash .github/scripts/tag-ancestry.sh "$GITHUB_SHA"

  # A release is blocked when the newest nightly bench on main is worse than
  # the committed baseline by more than the threshold, or when there is no
  # nightly result from the last 14 days (#36, ADR 0030 amendment).
  bench-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # list the Bench workflow's runs and download their results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Newest nightly bench results on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/bench-latest.sh "$GITHUB_REPOSITORY" "$RUNNER_TEMP/bench"
      - name: Regression gate
        run: go run ./internal/tools/benchgate -results "$RUNNER_TEMP/bench/results.json"

  release:
    needs: [ancestry, bench-gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the draft release, upload assets, publish it
      id-token: write # keyless cosign signature and build provenance
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install goreleaser and syft (sha256-pinned)
        run: bash .github/scripts/release-tools.sh
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Build, sign and upload a draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # The same commands the README and the release notes give users; the
      # draft is published only when they pass.
      - name: Verify like a user
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify-blob \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle checksums.txt.sigstore.json checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          for archive in *.tar.gz *.zip; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
      # After the release is public, so the cask and the manifest never name
      # a draft or unverified asset. The token (contents write on the tap and
      # the bucket only, ADR 0033) is given to this step alone; while it is
      # not set the script logs a warning and the release still succeeds.
      - name: Update the Homebrew tap and Scoop bucket
        env:
          PACKAGE_REPOS_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: bash .github/scripts/package-repos.sh "$GITHUB_REF_NAME" dist
