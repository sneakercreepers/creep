name: Release

# A v* tag builds, signs and publishes a release from the `release`
# environment (maintainer approval, v* tags only). Pull requests that touch the
# release files and manual runs only build a snapshot: no secrets, no
# signature, nothing published.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - .github/scripts/release-tools.sh
      - .github/scripts/tag-ancestry.sh
      - .github/scripts/package-repos.sh
  workflow_dispatch:

permissions: {}

# Every tag shares one group, so two releases never push the tap and the
# bucket at once; the push script also refuses to move them to an older version.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('release-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install goreleaser and syft (sha256-pinned)
        run: bash .github/scripts/release-tools.sh
      - name: goreleaser check
        run: goreleaser check
      - name: Ancestry guard accepts main and refuses a stray or release/* commit
        run: |
          bash .github/scripts/tag-ancestry.sh "$(git rev-parse refs/remotes/origin/main)"
          stray="$(git -c user.name=ci -c user.email=ci@invalid commit-tree -m stray 'HEAD^{tree}')"
          if bash .github/scripts/tag-ancestry.sh "$stray"; then
            echo "::error::the ancestry guard accepted a commit that is not on main"
            exit 1
          fi
          git update-ref refs/remotes/origin/release/stray "$stray"
          if bash .github/scripts/tag-ancestry.sh "$stray"; then
            echo "::error::the ancestry guard accepted a commit on an unprotected release/* branch"
            exit 1
          fi
      - name: Snapshot build (no signature, nothing published)
        run: goreleaser release --snapshot --clean --skip=sign,publish
      - name: Binaries are reproducible
        run: |
          sha256sum dist/creep_*/creep* > "$RUNNER_TEMP/first.sha256"
          goreleaser release --snapshot --clean --skip=sign,publish,sbom
          sha256sum dist/creep_*/creep* | diff "$RUNNER_TEMP/first.sha256" -
      # On the real goreleaser output: the cask and the manifest pin exactly
      # the archives checksums.txt lists, and the cask keeps the macOS
      # quarantine hook. The push script's refusals (no token, prerelease,
      # bad pin, downgrade) are Go tests in internal/tools/releasescripts,
      # run by make check and the required protections job.
      - name: Cask and Scoop manifest pin the release archives
        run: |
          bash .github/scripts/package-repos.sh --check-pins \
            "$(jq -r .tag dist/metadata.json)" "$(jq -r .version dist/metadata.json)" dist
          for want in postflight on_macos 'staged_path}}/creep'; do
            grep -qF "$want" dist/homebrew/Casks/creep.rb || { echo "::error::the cask lacks $want"; exit 1; }
          done

  ancestry:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: bash .github/scripts/tag-ancestry.sh "$GITHUB_SHA"

  # A release is blocked when the newest nightly bench on main is worse than
  # the committed baseline by more than the threshold, or when there is no
  # nightly result from the last 14 days (#36, ADR 0030 amendment).
  bench-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # list the Bench workflow's runs and download their results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Newest nightly bench results on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/bench-latest.sh "$GITHUB_REPOSITORY" "$RUNNER_TEMP/bench"
      - name: Regression gate
        run: go run ./internal/tools/benchgate -results "$RUNNER_TEMP/bench/results.json"

  release:
    needs: [ancestry, bench-gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the draft release, upload assets, publish it
      id-token: write # keyless cosign signature and build provenance
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install goreleaser and syft (sha256-pinned)
        run: bash .github/scripts/release-tools.sh
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Build, sign and upload a draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # The same commands the README and the release notes give users; the
      # draft is published only when they pass.
      - name: Verify like a user
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify-blob \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle checksums.txt.sigstore.json checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          for archive in *.tar.gz *.zip; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-manifests
          path: |
            dist/homebrew/Casks/creep.rb
            dist/scoop/creep.json
          if-no-files-found: error
          retention-days: 7

  # The tap and bucket token (contents write on those two repositories only,
  # ADR 0033) is used on a fresh runner that never ran goreleaser, syft or the
  # Go toolchain, so nothing they wrote to $GITHUB_ENV or $GITHUB_PATH can
  # reach it. It runs after the release is public, re-checks checksums.txt's
  # signature from the published release and only then gives the token to
  # the push script, which checks every pin first. Without the token the
  # script logs a warning and the release still succeeds. A failed push is
  # finished by re-running this job.
  package-repos:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # the push script and the published checksums.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-manifests
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Verify checksums.txt of the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json
          cosign verify-blob \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Update the Homebrew tap and Scoop bucket
        env:
          PACKAGE_REPOS_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: bash .github/scripts/package-repos.sh "$GITHUB_REF_NAME" dist
