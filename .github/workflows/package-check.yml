name: Package check

# Installs a published release from the Homebrew tap and the Scoop bucket on
# the platforms they serve (#357, ADR 0033): the cask's macOS-only quarantine
# postflight runs nowhere else. The release workflow calls it after
# package-repos; a maintainer can dispatch it with the latest release's tag
# (the tap and bucket hold only the latest, so an older tag fails the version
# check by design). It holds no secret and only reads, so a failure shows on the run and
# unpublishes nothing; recovery is in ADR 0033.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to install, such as v0.5.1
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Latest release tag (the one the tap and bucket hold), such as v0.5.1
        required: true
        type: string

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eqx 'v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}'; then
            echo "::error::tag must look like v1.2.3"
            exit 1
          fi

  homebrew:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; macos-15-intel is the Intel image left after
        # macos-13 was retired.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      # Users' brew updates itself before an install; a runner image's brew
      # can be too old for the cask DSL goreleaser renders (zap :not_required).
      - name: Update Homebrew
        run: |
          brew update
          brew --version
      - name: Install the cask from the tap
        run: brew install --cask sneakercreepers/tap/creep
      # Without a quarantined download the binary check below proves nothing.
      - name: Check the download was quarantined
        run: |
          archive="$(brew --cache --cask sneakercreepers/tap/creep)"
          xattr -l "$archive"
          if ! xattr -p com.apple.quarantine "$archive" >/dev/null 2>&1; then
            echo "::error::$archive has no com.apple.quarantine, so the postflight goes untested"
            exit 1
          fi
      - name: Check the version
        run: |
          got="$(creep version | head -n 1)"
          echo "$got"
          if [ "$got" != "creep $TAG" ]; then
            echo "::error::creep version printed '$got', want 'creep $TAG'"
            exit 1
          fi
      - name: Check the binary carries no quarantine attribute
        run: |
          bin="$(brew --caskroom)/creep/${TAG#v}/creep"
          if [ ! -f "$bin" ]; then
            echo "::error::no staged binary at $bin"
            exit 1
          fi
          xattr -l "$bin"
          if xattr -p com.apple.quarantine "$bin" >/dev/null 2>&1; then
            echo "::error::$bin still has com.apple.quarantine"
            exit 1
          fi

  scoop:
    needs: tag
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      # Scoop core v0.6.0, fetched by commit so the code that runs is fixed;
      # Scoop's web installer is unpinned and would pull Scoop's moving master.
      SCOOP_COMMIT: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f
    steps:
      # The hosted runner's only account is an administrator, so Scoop runs as
      # one; the job holds no secret or write token and nothing outlives it.
      - name: Install Scoop core at a pinned commit
        shell: pwsh
        run: |
          $core = "$env:USERPROFILE\scoop\apps\scoop\current"
          git init -q $core
          git -C $core fetch -q --depth 1 https://github.com/ScoopInstaller/Scoop.git $env:SCOOP_COMMIT
          git -C $core checkout -q FETCH_HEAD
          $head = git -C $core rev-parse HEAD
          if ($head -ne $env:SCOOP_COMMIT) {
            Write-Output "::error::Scoop core is at $head, want $env:SCOOP_COMMIT"
            exit 1
          }
          # Scoop lists the shims and buckets directories, which its installer
          # would have created.
          New-Item -ItemType Directory -Force "$env:USERPROFILE\scoop\shims", "$env:USERPROFILE\scoop\buckets" | Out-Null
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\scoop\shims"
      - name: Install creep from the bucket
        shell: pwsh
        run: |
          $scoop = "$env:USERPROFILE\scoop\apps\scoop\current\bin\scoop.ps1"
          & $scoop bucket add sneakercreepers https://github.com/sneakercreepers/scoop-bucket
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # -u: never self-update Scoop core away from the pinned commit.
          & $scoop install -u sneakercreepers/creep
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check the version
        shell: pwsh
        run: |
          $got = (creep version | Select-Object -First 1)
          Write-Output $got
          if ($got -ne "creep $env:TAG") {
            Write-Output "::error::creep version printed '$got', want 'creep $env:TAG'"
            exit 1
          }
